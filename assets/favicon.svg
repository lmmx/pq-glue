<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="pq-glue: the row groups of two Parquet files joined into one">
  <!-- two input files, their row groups as bars -->
  <g>
    <rect x="8" y="14" width="62" height="58" rx="7" fill="#0b6e6e"/>
    <rect x="16" y="24" width="46" height="10" rx="3" fill="#e8f4f4"/>
    <rect x="16" y="40" width="46" height="10" rx="3" fill="#e8f4f4"/>
    <rect x="16" y="56" width="30" height="8" rx="3" fill="#e8f4f4"/>
  </g>
  <g>
    <rect x="8" y="88" width="62" height="58" rx="7" fill="#f2b544"/>
    <rect x="16" y="98" width="46" height="10" rx="3" fill="#fff6e3"/>
    <rect x="16" y="114" width="46" height="10" rx="3" fill="#fff6e3"/>
    <rect x="16" y="130" width="22" height="8" rx="3" fill="#fff6e3"/>
  </g>
  <!-- the glue: arrows into one file -->
  <path d="M74 43 C 98 43, 100 70, 118 74" stroke="#7a7a7a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M74 117 C 98 117, 100 90, 118 86" stroke="#7a7a7a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M112 66 L 124 80 L 112 94" stroke="#7a7a7a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the output: the same row groups, in order -->
  <g>
    <rect x="130" y="20" width="62" height="120" rx="7" fill="#33403f"/>
    <rect x="138" y="30" width="46" height="10" rx="3" fill="#13a3a3"/>
    <rect x="138" y="46" width="46" height="10" rx="3" fill="#13a3a3"/>
    <rect x="138" y="62" width="30" height="8" rx="3" fill="#13a3a3"/>
    <rect x="138" y="80" width="46" height="10" rx="3" fill="#f2b544"/>
    <rect x="138" y="96" width="46" height="10" rx="3" fill="#f2b544"/>
    <rect x="138" y="112" width="22" height="8" rx="3" fill="#f2b544"/>
  </g>
</svg>
