<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 128" role="img" aria-label="pq-glue: two blocks, indigo and amber, joined in order into one">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f08a24"/>
    </linearGradient>
    <clipPath id="whole">
      <rect x="84" y="8" width="68" height="112" rx="22"/>
    </clipPath>
  </defs>
  <!-- the inputs -->
  <rect x="8" y="8" width="52" height="52" rx="16" fill="url(#indigo)" opacity="0.55"/>
  <rect x="8" y="68" width="52" height="52" rx="16" fill="url(#amber)" opacity="0.55"/>
  <!-- the output: both, in order, meeting at a seam -->
  <g clip-path="url(#whole)">
    <rect x="84" y="8" width="68" height="57" fill="url(#indigo)"/>
    <rect x="84" y="63" width="68" height="57" fill="url(#amber)"/>
  </g>
</svg>
