[package]
authors = ["Louis Maddox <louismmx@gmail.com>"]
categories = ["encoding", "filesystem"]
description = "Glue Parquet files together by copying their encoded row groups, without decoding them"
edition = "2021"
keywords = ["arrow", "concatenate", "parquet"]
license = "MIT"
name = "pq-glue"
readme = "README.md"
repository = "https://github.com/lmmx/pq-glue"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]
name = "pq_glue"

[dependencies]
# No codecs: column chunks are copied as they are, never decompressed (bytes, which
# parquet depends on, holds small inputs read whole). The `write` feature (Arrow record
# batches written to Parquet) adds Arrow, zstd and snappy
arrow-array = { optional = true, version = "60.0.0" }
arrow-schema = { optional = true, version = "60.0.0" }
arrow-select = { optional = true, version = "60.0.0" }
bytes = "1.10"
parquet = { default-features = false, version = "60.0.0" }
pyo3 = { features = ["abi3-py310"], optional = true, version = "0.29" }
rayon = { optional = true, version = "1.11.0" }
rustc-hash = { optional = true, version = "2" }
xxhash-rust = { features = ["xxh64"], optional = true, version = "0.8.15" }

[dev-dependencies]
arrow-array = "60.0.0"
arrow-buffer = "60.0.0"
arrow-cast = "60.0.0"
arrow-schema = "60.0.0"
arrow-select = "60.0.0"
parquet = { default-features = false, features = ["arrow"], version = "60.0.0" }
tempfile = "3.23.0"

[features]
default = []
# Many concatenations at once (`pq_glue::concat_many`), on rayon
parallel = ["dep:rayon"]
# The Python extension module (built by maturin, see pyproject.toml)
python = ["arrow-array/ffi", "dep:pyo3", "parallel", "read", "write"]
# A Parquet file read to Arrow record batches (`pq_glue::read`), its row groups decoded in
# parallel
read = [
  "dep:arrow-array",
  "dep:arrow-schema",
  "dep:arrow-select",
  "dep:rayon",
  "parquet/arrow",
  "parquet/snap",
  "parquet/zstd",
]
# Arrow record batches written to Parquet (`pq_glue::write`), their row groups' columns
# encoded in parallel
write = [
  "dep:arrow-array",
  "dep:arrow-schema",
  "dep:rayon",
  "dep:rustc-hash",
  "dep:xxhash-rust",
  "parquet/arrow",
  "parquet/snap",
  "parquet/zstd",
]

[profile.dev]
codegen-units = 256
debug = false
lto = false
opt-level = 0
panic = "unwind"
strip = "debuginfo"

[profile.release]
codegen-units = 1
debug = false
lto = "thin"
opt-level = 2
panic = "unwind"
strip = "symbols"
