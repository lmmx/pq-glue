[project]
copyright = "pq-glue is licensed under MIT"
docs_dir = "docs/site"
edit_uri = "edit/master/docs/site/"
extra_css = ["assets/stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },
  { "Concepts" = [
    "concepts/index.md",
    { "What is copied" = "concepts/copying.md" },
    { "Column orders" = "concepts/column-orders.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "pq_glue (Python)" = "reference/api/pq_glue.md" },
    { "pq-glue (Rust)" = "reference/rust.md" },
  ] },
  { "Background" = [
    "background/history.md",
  ] },
  { "Maintainers" = [
    "maintainers/development.md",
    "maintainers/documentation.md",
    "maintainers/releasing.md",
  ] },
]
repo_name = "lmmx/pq-glue"
repo_url = "https://github.com/lmmx/pq-glue"
site_author = "Louis Maddox"
site_description = "Concatenate Parquet files without decoding them."
site_name = "pq-glue"
site_url = "https://lmmx.github.io/pq-glue/"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.snippets]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.plugins.search]

# API reference: mkdocstrings' Python handler (griffe, static analysis of python/; the
# compiled module is read from its stub, _pq_glue.pyi)
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
filters = "public"
group_by_category = false
heading_level = 2
line_length = 88
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_if_no_docstring = true
show_labels = true
show_object_full_path = false
show_root_full_path = true
show_root_heading = false
show_root_members_full_path = false
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
summary = false

[project.theme]
favicon = "assets/favicon.svg"
features = [
  "content.action.copy",
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]
font.code = "IBM Plex Mono"
font.text = "IBM Plex Sans"
language = "en"
logo = "assets/favicon.svg"
variant = "modern"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
accent = "custom"
media = "(prefers-color-scheme: light)"
primary = "custom"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent = "custom"
media = "(prefers-color-scheme: dark)"
primary = "custom"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lmmx/pq-glue"
name = "pq-glue on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/pq-glue/"
name = "pq-glue on PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/rust"
link = "https://crates.io/crates/pq-glue"
name = "pq-glue on crates.io"

# llms.txt, llms-full.txt and a Markdown copy of each page listed here (<page>/index.md).
# Each description must equal the page's front-matter description (check_site.py).
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """
pq-glue concatenates Parquet files that share a schema by copying their encoded row
groups into one file, without decoding them, from Python (`pq_glue.concat`) or Rust
(`pq_glue::concat`). Install with `pip install pq-glue`. Each link below is the Markdown
version of a page of https://lmmx.github.io/pq-glue/.
"""

[project.plugins.llmstxt.sections]
"Concepts" = [
  { "concepts/index.md" = "How pq-glue concatenates Parquet files: row groups are copied as bytes, and only the footer is new." },
  { "concepts/copying.md" = "What the output file contains, what the inputs must share, and what concat refuses." },
  { "concepts/column-orders.md" = "Why pq-glue rewrites the footer's column orders, so that copied float statistics stay readable." },
]
"Get started" = [
  { "getting-started/installation.md" = "Install pq-glue from PyPI or crates.io." },
  { "getting-started/quickstart.md" = "Write two Parquet files with pyarrow, concatenate them with pq_glue.concat, and check the result." },
]
"Optional" = [
  { "background/history.md" = "pq-glue's development journal: where its dated entries are and what each one records." },
  { "maintainers/development.md" = "The repository's layout, how to build and test pq-glue, and the commit conventions." },
  { "maintainers/documentation.md" = "How the documentation site is built, checked, tested and published to GitHub Pages." },
  { "maintainers/releasing.md" = "How pq-glue is released to PyPI (CI builds and uploads the wheels) and to crates.io (release-plz)." },
]
"Reference" = [
  { "reference/index.md" = "pq-glue's API in Python and in Rust." },
  { "reference/api/pq_glue.md" = "The pq_glue Python package: concat and its errors." },
  { "reference/rust.md" = "The pq-glue Rust crate: concat, Error and the footer module." },
]
"Start here" = [
  { "index.md" = "Concatenate Parquet files without decoding them." },
]
